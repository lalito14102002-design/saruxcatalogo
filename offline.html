<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sin conexión | SARUX</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#060606;color:#fff;font-family:'Arial',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
  .logo{font-size:3rem;font-weight:900;color:#e8192c;letter-spacing:8px;margin-bottom:1.5rem}
  .icon{font-size:3rem;margin-bottom:1rem;opacity:.6}
  h1{font-size:1.1rem;letter-spacing:3px;color:#fff;margin-bottom:.8rem;font-weight:700}
  p{font-size:.8rem;color:#888;line-height:1.7;max-width:280px;margin:0 auto 2rem}
  .btn{display:inline-block;background:#e8192c;color:#fff;font-size:.7rem;letter-spacing:3px;padding:.8rem 1.8rem;cursor:pointer;border:none;font-weight:700;text-decoration:none}
  .btn:active{opacity:.8}
</style>
</head>
<body>
  <div>
    <div class="logo">SARUX</div>
    <div class="icon">📡</div>
    <h1>SIN CONEXIÓN</h1>
    <p>Parece que no tienes internet en este momento. Revisa tu conexión e intenta de nuevo.</p>
    <button class="btn" onclick="window.location.reload()">REINTENTAR</button>
  </div>
</body>
</html>
