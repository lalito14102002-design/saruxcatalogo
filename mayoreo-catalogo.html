<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catálogo Mayoreo | SARUX</title>
  <meta name="description" content="Catálogo de mayoreo SARUX — Precios especiales por volumen en Puebla">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Layout base ── */
    body{background:var(--black);color:var(--white);margin:0;padding:0;font-family:var(--font-body)}

    /* ── Header ── */
    .my-header{background:var(--black);border-bottom:2px solid var(--neon);padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:100}
    .my-back{background:none;border:1px solid rgba(232,25,44,.35);color:var(--neon);font-family:var(--font-mono);font-size:.6rem;letter-spacing:2px;padding:.5rem .9rem;cursor:pointer;text-decoration:none;transition:background .2s}
    .my-back:hover{background:rgba(232,25,44,.1)}
    .my-header-title{font-family:var(--font-display);font-size:1.1rem;letter-spacing:6px;color:var(--white)}
    .my-header-badge{background:var(--neon);color:#000;font-family:var(--font-mono);font-size:.45rem;letter-spacing:2px;padding:.2rem .5rem;margin-left:.5rem;font-weight:700}
    .my-share-btn{margin-left:auto;background:none;border:1px solid var(--border);color:var(--gray);font-family:var(--font-mono);font-size:.55rem;letter-spacing:2px;padding:.5rem .8rem;cursor:pointer;display:flex;align-items:center;gap:.4rem;transition:border-color .2s,color .2s}
    .my-share-btn:hover{border-color:var(--neon);color:var(--neon)}

    /* ── Search bar ── */
    .my-search-wrap{padding:1rem 1.5rem;border-bottom:1px solid var(--border);background:rgba(232,25,44,.03)}
    .my-search{width:100%;background:var(--card);border:1px solid var(--border);color:var(--white);padding:.8rem 1rem;font-family:var(--font-mono);font-size:.7rem;letter-spacing:1px;box-sizing:border-box;outline:none;transition:border-color .2s}
    .my-search:focus{border-color:var(--neon)}
    .my-search::placeholder{color:var(--gray)}

    /* ── Grid de productos ── */
    .my-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);padding:0}
    .my-card{background:var(--card);cursor:pointer;transition:background .2s;position:relative;overflow:hidden;display:flex;flex-direction:column}
    .my-card:hover{background:rgba(20,0,3,1)}
    .my-card:active{background:var(--card2)}

    /* Banda diagonal MAYOREO */
    .my-card::before{content:'MAYOREO';position:absolute;top:10px;right:-22px;background:var(--neon);color:#000;font-family:var(--font-mono);font-size:.38rem;letter-spacing:2px;padding:.15rem 1.8rem;transform:rotate(35deg);font-weight:700;z-index:2}

    .my-card-img{width:100%;aspect-ratio:1;overflow:hidden;position:relative;background:#111}
    .my-card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
    .my-card:hover .my-card-img img{transform:scale(1.05)}
    .my-card-no-img{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0000,#1a0005);font-size:3rem}

    .my-card-body{padding:.8rem;flex:1;display:flex;flex-direction:column;gap:.3rem;border-top:1px solid rgba(232,25,44,.15)}
    .my-card-nombre{font-family:var(--font-display);font-size:.95rem;letter-spacing:2px;color:var(--white);line-height:1.2}
    .my-card-precio{font-family:var(--font-mono);font-size:.9rem;color:var(--neon);letter-spacing:1px;font-weight:700}
    .my-card-desc{font-size:.72rem;color:var(--gray);font-weight:300;line-height:1.5;flex:1}
    .my-card-piezas{font-family:var(--font-mono);font-size:.5rem;letter-spacing:2px;color:rgba(232,25,44,.7);margin-top:.2rem}
    .my-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:.5rem}
    .my-card-ver{font-family:var(--font-mono);font-size:.45rem;letter-spacing:2px;color:var(--neon);border:1px solid rgba(232,25,44,.3);padding:.25rem .6rem}
    .my-card-share{background:none;border:none;color:var(--gray);font-size:.9rem;cursor:pointer;padding:.2rem;transition:color .2s}
    .my-card-share:hover{color:var(--neon)}

    /* ── Empty state ── */
    .my-empty{grid-column:1/-1;padding:4rem 1.5rem;text-align:center;color:var(--gray)}
    .my-empty-icon{font-size:3rem;margin-bottom:1rem}
    .my-empty-text{font-family:var(--font-mono);font-size:.65rem;letter-spacing:2px}

    /* ── Modal ── */
    .my-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;overflow-y:auto;padding:1.5rem 1rem}
    .my-modal-overlay.open{display:flex;align-items:flex-start;justify-content:center}
    .my-modal{background:var(--card);border:1px solid rgba(232,25,44,.3);max-width:480px;width:100%;position:relative;animation:slideUp .3s ease}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .my-modal-close{position:absolute;top:.8rem;right:.8rem;background:none;border:none;color:var(--gray);font-size:1.3rem;cursor:pointer;z-index:2;line-height:1}
    .my-modal-img{width:100%;aspect-ratio:1;overflow:hidden;background:#111;position:relative}
    .my-modal-img img{width:100%;height:100%;object-fit:cover;display:block}
    .my-modal-no-img{width:100%;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0000,#1a0005);font-size:5rem}
    .my-modal-body{padding:1.2rem 1.3rem 1.5rem}
    .my-modal-badge{font-family:var(--font-mono);font-size:.5rem;letter-spacing:3px;color:var(--neon);margin-bottom:.4rem}
    .my-modal-nombre{font-family:var(--font-display);font-size:1.4rem;letter-spacing:3px;color:var(--white);margin-bottom:.4rem;line-height:1.2}
    .my-modal-precio{font-family:var(--font-mono);font-size:1.3rem;color:var(--neon);font-weight:700;margin-bottom:.8rem}
    .my-modal-desc{font-size:.85rem;color:var(--gray);font-weight:300;line-height:1.7;margin-bottom:1rem}
    .my-modal-sec{font-family:var(--font-mono);font-size:.5rem;letter-spacing:3px;color:rgba(255,255,255,.4);margin-bottom:.5rem;margin-top:.8rem}
    .my-modal-contenido{background:rgba(232,25,44,.05);border:1px solid rgba(232,25,44,.15);padding:.8rem 1rem;margin-bottom:1rem}
    .my-modal-contenido-item{display:flex;align-items:center;gap:.6rem;padding:.3rem 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.82rem;color:var(--light)}
    .my-modal-contenido-item:last-child{border-bottom:none}
    .my-modal-contenido-item span{color:var(--neon);font-family:var(--font-mono);font-size:.7rem;font-weight:700;min-width:2rem}
    .my-modal-btns{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem}
    .my-modal-wa{background:var(--neon);color:#000;border:none;padding:1rem;font-family:var(--font-display);font-size:.85rem;letter-spacing:3px;cursor:pointer;width:100%;transition:opacity .2s}
    .my-modal-wa:hover{opacity:.9}
    .my-modal-share{background:none;border:1px solid var(--border);color:var(--gray);padding:.7rem;font-family:var(--font-mono);font-size:.6rem;letter-spacing:2px;cursor:pointer;width:100%;transition:border-color .2s,color .2s}
    .my-modal-share:hover{border-color:var(--neon);color:var(--neon)}

    /* ── Toast ── */
    #myToast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(60px);background:var(--card);border:1px solid var(--neon);color:var(--white);font-family:var(--font-mono);font-size:.65rem;letter-spacing:1px;padding:.7rem 1.2rem;z-index:99999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
    #myToast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:480px){
      .my-card-nombre{font-size:.82rem}
      .my-modal-nombre{font-size:1.1rem}
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="my-header">
  <a href="index.html#mayoreo" class="my-back">← VOLVER</a>
  <div>
    <span class="my-header-title">MAYOREO</span>
    <span class="my-header-badge">SARUX</span>
  </div>
  <button class="my-share-btn" onclick="compartirCatalogo()">🔗 COMPARTIR</button>
</header>

<!-- Buscador -->
<div class="my-search-wrap">
  <input class="my-search" id="mySearch" placeholder="🔍 Buscar producto de mayoreo..." oninput="filtrar(this.value)">
</div>

<!-- Grid -->
<div class="my-grid" id="myGrid">
  <div class="my-empty" style="grid-column:1/-1;padding:2rem;text-align:center;font-family:var(--font-mono);font-size:.6rem;color:var(--gray)">Cargando...</div>
</div>

<!-- Modal detalle -->
<div class="my-modal-overlay" id="myModalOverlay" onclick="if(event.target===this)cerrarModal()">
  <div class="my-modal" id="myModal">
    <button class="my-modal-close" onclick="cerrarModal()">✕</button>
    <div id="myModalMedia"></div>
    <div class="my-modal-body">
      <div class="my-modal-badge">MAYOREO SARUX</div>
      <div class="my-modal-nombre" id="myModalNombre"></div>
      <div class="my-modal-precio" id="myModalPrecio"></div>
      <div class="my-modal-desc" id="myModalDesc"></div>
      <div id="myModalContenidoWrap" style="display:none">
        <div class="my-modal-sec">CONTENIDO DEL PAQUETE</div>
        <div class="my-modal-contenido" id="myModalContenido"></div>
      </div>
      <div class="my-modal-btns">
        <button class="my-modal-wa" id="myModalWA">📱 COTIZAR POR WHATSAPP</button>
        <button class="my-modal-share" onclick="compartirProducto()">🔗 COPIAR ENLACE DE ESTE PRODUCTO</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="myToast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
let PRODUCTOS = [];
let PROD_ACTIVO = null;
let NEGOCIO_WA = '';

// Cargar número WhatsApp de config
async function cargarConfig(){
  try {
    const { data } = await sb.from('site_config').select('config_data').eq('id',1).single();
    if(data && data.config_data && data.config_data.NEGOCIO){
      NEGOCIO_WA = data.config_data.NEGOCIO.whatsapp || '';
    }
  } catch(e){}
}

async function cargarProductos(){
  const grid = document.getElementById('myGrid');
  try {
    const { data, error } = await sb
      .from('mayoreo_productos')
      .select('*')
      .eq('activo', true)
      .order('orden', {ascending: true})
      .order('created_at', {ascending: false});

    if(error) throw error;
    PRODUCTOS = data || [];
    renderGrid(PRODUCTOS);
  } catch(e){
    grid.innerHTML = `<div class="my-empty"><div class="my-empty-icon">📦</div><div class="my-empty-text">Error cargando productos</div></div>`;
  }
}

function renderGrid(prods){
  const grid = document.getElementById('myGrid');
  if(!prods.length){
    grid.innerHTML = `<div class="my-empty"><div class="my-empty-icon">📦</div><div class="my-empty-text">PRÓXIMAMENTE PRODUCTOS DE MAYOREO</div></div>`;
    return;
  }
  grid.innerHTML = prods.map((p,i) => {
    const imgEl = p.imagen_url
      ? `<div class="my-card-img"><img src="${p.imagen_url}" alt="${p.nombre}" loading="lazy"></div>`
      : `<div class="my-card-no-img">${p.emoji||'📦'}</div>`;
    const piezasEl = p.piezas ? `<div class="my-card-piezas">✦ ${p.piezas}</div>` : '';
    const precioEl = p.precio ? `<div class="my-card-precio">$${Number(p.precio).toLocaleString('es-MX')} MXN</div>` : '';
    return `<div class="my-card" onclick="abrirModal(${i})">
      ${imgEl}
      <div class="my-card-body">
        <div class="my-card-nombre">${p.nombre}</div>
        ${precioEl}
        ${piezasEl}
        <div class="my-card-desc">${p.descripcion||''}</div>
        <div class="my-card-footer">
          <span class="my-card-ver">VER DETALLES →</span>
          <button class="my-card-share" onclick="event.stopPropagation();compartirProductoIdx(${i})" title="Copiar enlace">🔗</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function filtrar(q){
  const term = q.trim().toLowerCase();
  if(!term){ renderGrid(PRODUCTOS); return; }
  const res = PRODUCTOS.filter(p =>
    (p.nombre||'').toLowerCase().includes(term) ||
    (p.descripcion||'').toLowerCase().includes(term) ||
    (p.piezas||'').toLowerCase().includes(term)
  );
  renderGrid(res);
  if(!res.length){
    document.getElementById('myGrid').innerHTML = `
      <div class="my-empty">
        <div class="my-empty-icon">🔍</div>
        <div class="my-empty-text">SIN RESULTADOS PARA "${q.trim().toUpperCase()}"</div>
      </div>`;
  }
}

function abrirModal(idx){
  const p = PRODUCTOS[idx];
  PROD_ACTIVO = p;
  // Media
  const media = document.getElementById('myModalMedia');
  media.innerHTML = p.imagen_url
    ? `<div class="my-modal-img"><img src="${p.imagen_url}" alt="${p.nombre}"></div>`
    : `<div class="my-modal-no-img">${p.emoji||'📦'}</div>`;
  // Info
  document.getElementById('myModalNombre').textContent = p.nombre;
  document.getElementById('myModalPrecio').textContent = p.precio ? `$${Number(p.precio).toLocaleString('es-MX')} MXN` : '';
  document.getElementById('myModalDesc').textContent = p.descripcion || '';
  // Contenido paquete
  const cWrap = document.getElementById('myModalContenidoWrap');
  const cEl = document.getElementById('myModalContenido');
  if(p.contenido_activo && p.contenido){
    try {
      const items = typeof p.contenido === 'string' ? JSON.parse(p.contenido) : p.contenido;
      if(items && items.length){
        cEl.innerHTML = items.map(it => `<div class="my-modal-contenido-item"><span>${it.cantidad}</span>${it.producto}</div>`).join('');
        cWrap.style.display = 'block';
      } else { cWrap.style.display='none'; }
    } catch(e){ cWrap.style.display='none'; }
  } else { cWrap.style.display='none'; }
  // WA button
  const waBtn = document.getElementById('myModalWA');
  const msg = encodeURIComponent(`Hola! Me interesa cotizar por mayoreo: *${p.nombre}*${p.precio ? ' — $'+Number(p.precio).toLocaleString('es-MX')+' MXN' : ''}. ¿Me pueden dar más información?`);
  waBtn.onclick = () => window.open(`https://wa.me/${NEGOCIO_WA}?text=${msg}`, '_blank');
  // Abrir
  document.getElementById('myModalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function cerrarModal(){
  document.getElementById('myModalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  PROD_ACTIVO = null;
}

function getShareUrl(prod){
  const base = window.location.href.split('?')[0];
  return base + '?prod=' + encodeURIComponent(prod.nombre);
}

function compartirProducto(){
  if(!PROD_ACTIVO) return;
  const url = getShareUrl(PROD_ACTIVO);
  if(navigator.share){
    navigator.share({ title: PROD_ACTIVO.nombre + ' | SARUX Mayoreo', url }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(url).then(()=>toast('🔗 Link copiado')).catch(()=>toast('🔗 '+url));
  }
}

function compartirProductoIdx(idx){
  const p = PRODUCTOS[idx];
  const url = getShareUrl(p);
  if(navigator.share){
    navigator.share({ title: p.nombre + ' | SARUX Mayoreo', url }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(url).then(()=>toast('🔗 Link copiado')).catch(()=>toast('🔗 '+url));
  }
}

function compartirCatalogo(){
  const url = window.location.href.split('?')[0];
  if(navigator.share){
    navigator.share({ title: 'Catálogo Mayoreo | SARUX', url }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(url).then(()=>toast('🔗 Link del catálogo copiado')).catch(()=>toast('🔗 '+url));
  }
}

function toast(msg){
  const t = document.getElementById('myToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// Deep link — abrir producto desde URL o filtrar por evento
function checkDeepLink(){
  const params = new URLSearchParams(window.location.search);
  // Filtro por evento (cuando viene de tarjeta Bodas / XV / etc.)
  const evento = params.get('evento');
  if(evento){
    const emojis = {'bodas':'💍','xv años':'👑','graduaciones':'🎓','empresas':'🏢'};
    const emoji = emojis[evento.toLowerCase()] || '🎉';
    // Actualizar título del header
    const titleEl = document.querySelector('.my-header-title');
    if(titleEl) titleEl.textContent = emoji + ' ' + evento.toUpperCase();
    // Actualizar placeholder del buscador
    const searchEl = document.getElementById('mySearch');
    if(searchEl) searchEl.placeholder = `🔍 Buscar en ${evento}...`;
    // Filtrar productos si tienen campo 'evento' o 'categoria'
    const filtrados = PRODUCTOS.filter(p =>
      (p.evento && p.evento.toLowerCase() === evento.toLowerCase()) ||
      (p.categoria && p.categoria.toLowerCase() === evento.toLowerCase())
    );
    // Si hay productos con esa categoría, mostrar solo esos; si no, mostrar todos
    if(filtrados.length > 0){
      renderGrid(filtrados);
    }
    // Actualizar botón compartir para que comparta esta vista de categoría
    const shareBtn = document.querySelector('.my-share-btn');
    if(shareBtn){
      const urlCat = window.location.href.split('?')[0] + '?evento=' + encodeURIComponent(evento);
      shareBtn.onclick = () => {
        if(navigator.share){
          navigator.share({ title: `${evento} | SARUX Mayoreo`, url: urlCat }).catch(()=>{});
        } else {
          navigator.clipboard.writeText(urlCat).then(()=>toast('🔗 Link de '+evento+' copiado')).catch(()=>toast('🔗 '+urlCat));
        }
      };
    }
  }
  // Deep link a producto específico
  const prod = params.get('prod');
  if(prod){
    const idx = PRODUCTOS.findIndex(p => p.nombre === prod);
    if(idx >= 0) abrirModal(idx);
  }
}

// Init
(async function(){
  await cargarConfig();
  await cargarProductos();
  checkDeepLink();
})();
</script>
</body>
</html>
