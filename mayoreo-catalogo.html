<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catálogo Mayoreo | SARUX</title>
  <meta name="description" content="Catálogo de mayoreo SARUX — Paquetes por evento: Bodas, XV Años, Graduaciones y más">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:var(--black);color:var(--white);margin:0;padding:0;font-family:var(--font-body)}

    /* ── Header ── */
    .my-header{background:var(--black);border-bottom:2px solid var(--neon);padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:100}
    .my-back{background:none;border:1px solid rgba(232,25,44,.35);color:var(--neon);font-family:var(--font-mono);font-size:.6rem;letter-spacing:2px;padding:.5rem .9rem;cursor:pointer;text-decoration:none;transition:background .2s}
    .my-back:hover{background:rgba(232,25,44,.1)}
    .my-header-title{font-family:var(--font-display);font-size:1.1rem;letter-spacing:6px;color:var(--white)}
    .my-header-badge{background:var(--neon);color:#000;font-family:var(--font-mono);font-size:.45rem;letter-spacing:2px;padding:.2rem .5rem;margin-left:.5rem;font-weight:700}
    .my-share-btn{margin-left:auto;background:none;border:1px solid var(--border);color:var(--gray);font-family:var(--font-mono);font-size:.55rem;letter-spacing:2px;padding:.5rem .8rem;cursor:pointer;display:flex;align-items:center;gap:.4rem;transition:border-color .2s,color .2s}
    .my-share-btn:hover{border-color:var(--neon);color:var(--neon)}

    /* ── Hero info ── */
    .my-hero{padding:1.5rem 1.5rem 1rem;background:linear-gradient(180deg,rgba(232,25,44,.06) 0%,transparent 100%);border-bottom:1px solid var(--border)}
    .my-hero-label{font-family:var(--font-mono);font-size:.5rem;letter-spacing:4px;color:var(--neon);margin-bottom:.3rem}
    .my-hero-title{font-family:var(--font-display);font-size:1.6rem;letter-spacing:4px;color:var(--white);line-height:1.1;margin:0 0 .4rem}
    .my-hero-desc{font-size:.75rem;color:var(--gray);font-weight:300;margin:0}

    /* ── Grid de categorías ── */
    .my-cats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border)}
    .my-cat-card{background:var(--card);cursor:pointer;transition:background .2s;position:relative;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
    .my-cat-card:hover{background:rgba(20,0,3,1)}
    .my-cat-card:active{background:var(--card2)}

    /* Banda MAYOREO */
    .my-cat-card::before{content:'MAYOREO';position:absolute;top:10px;right:-22px;background:var(--neon);color:#000;font-family:var(--font-mono);font-size:.38rem;letter-spacing:2px;padding:.15rem 1.8rem;transform:rotate(35deg);font-weight:700;z-index:2}

    .my-cat-img{width:100%;aspect-ratio:1;overflow:hidden;position:relative;background:#111}
    .my-cat-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
    .my-cat-card:hover .my-cat-img img{transform:scale(1.05)}
    .my-cat-emoji{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0000,#1a0005);font-size:3.5rem}

    .my-cat-body{padding:.9rem;flex:1;display:flex;flex-direction:column;gap:.25rem;border-top:1px solid rgba(232,25,44,.15)}
    .my-cat-nombre{font-family:var(--font-display);font-size:1rem;letter-spacing:2px;color:var(--white);line-height:1.2}
    .my-cat-desc{font-size:.7rem;color:var(--gray);font-weight:300;line-height:1.5;flex:1}
    .my-cat-count{font-family:var(--font-mono);font-size:.48rem;letter-spacing:2px;color:rgba(232,25,44,.7);margin-top:.2rem}
    .my-cat-ver{font-family:var(--font-mono);font-size:.45rem;letter-spacing:2px;color:var(--neon);border:1px solid rgba(232,25,44,.3);padding:.25rem .6rem;margin-top:.5rem;display:inline-block}

    /* ── Empty / Loading ── */
    .my-empty{grid-column:1/-1;padding:4rem 1.5rem;text-align:center;color:var(--gray)}
    .my-empty-icon{font-size:3rem;margin-bottom:1rem}
    .my-empty-text{font-family:var(--font-mono);font-size:.65rem;letter-spacing:2px}

    /* ── Toast ── */
    #myToast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(60px);background:var(--card);border:1px solid var(--neon);color:var(--white);font-family:var(--font-mono);font-size:.65rem;letter-spacing:1px;padding:.7rem 1.2rem;z-index:99999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
    #myToast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:380px){
      .my-cat-nombre{font-size:.85rem}
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="my-header">
  <a href="javascript:void(0)" onclick="volverAtras()" class="my-back">← VOLVER</a>
  <div>
    <span class="my-header-title">MAYOREO</span>
    <span class="my-header-badge">SARUX</span>
  </div>
  <button class="my-share-btn" onclick="compartirCatalogo()">🔗 COMPARTIR</button>
</header>

<!-- Hero -->
<div class="my-hero">
  <div class="my-hero-label">PARA CADA OCASIÓN</div>
  <div class="my-hero-title">TIPOS DE<br>EVENTOS</div>
  <p class="my-hero-desc">Selecciona tu tipo de evento para ver los productos disponibles</p>
</div>

<!-- Grid de categorías -->
<div class="my-cats-grid" id="myCatsGrid">
  <div class="my-empty" style="grid-column:1/-1;padding:2rem;text-align:center;font-family:var(--font-mono);font-size:.6rem;color:var(--gray)">Cargando...</div>
</div>

<!-- Toast -->
<div id="myToast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

function volverAtras(){
  // Si hay historial dentro del sitio, retroceder. Si no, ir a index#mayoreo
  if(document.referrer && document.referrer.includes(window.location.hostname)){
    history.back();
  } else {
    window.location.href = 'index.html#mayoreo';
  }
}

async function cargarCategorias(){
  const grid = document.getElementById('myCatsGrid');
  try {
    const { data, error } = await sb
      .from('mayoreo_categorias')
      .select('*')
      .eq('activa', true)
      .order('orden', { ascending: true })
      .order('created_at', { ascending: true });

    if(error) throw error;
    const cats = data || [];

    if(!cats.length){
      grid.innerHTML = `<div class="my-empty"><div class="my-empty-icon">🎊</div><div class="my-empty-text">PRÓXIMAMENTE CATEGORÍAS</div></div>`;
      return;
    }

    // Contar productos por categoría
    const { data: counts } = await sb
      .from('mayoreo_productos')
      .select('categoria_id')
      .eq('activo', true);

    const cmap = {};
    (counts||[]).forEach(r => { cmap[r.categoria_id] = (cmap[r.categoria_id]||0)+1; });

    grid.innerHTML = cats.map(c => {
      const imgEl = c.imagen_url
        ? `<div class="my-cat-img"><img src="${c.imagen_url}" alt="${c.nombre}" loading="lazy"></div>`
        : `<div class="my-cat-emoji">${c.emoji||'🎊'}</div>`;
      const cnt = cmap[c.id] || 0;
      const countEl = cnt > 0 ? `<div class="my-cat-count">✦ ${cnt} producto${cnt!==1?'s':''}</div>` : '';
      return `<a class="my-cat-card" href="mayoreo-cat-productos.html?cat=${encodeURIComponent(c.nombre)}&id=${c.id}">
        ${imgEl}
        <div class="my-cat-body">
          <div class="my-cat-nombre">${c.nombre}</div>
          <div class="my-cat-desc">${c.descripcion||''}</div>
          ${countEl}
          <span class="my-cat-ver">VER PRODUCTOS →</span>
        </div>
      </a>`;
    }).join('');

  } catch(e){
    grid.innerHTML = `<div class="my-empty"><div class="my-empty-icon">⚠️</div><div class="my-empty-text">Error cargando categorías</div></div>`;
  }
}

function compartirCatalogo(){
  const url = window.location.href.split('?')[0];
  if(navigator.share){
    navigator.share({ title: 'Catálogo Mayoreo | SARUX', url }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(url).then(()=>toast('🔗 Link del catálogo copiado')).catch(()=>toast('🔗 '+url));
  }
}

function toast(msg){
  const t = document.getElementById('myToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

cargarCategorias();
</script>
</body>
</html>
